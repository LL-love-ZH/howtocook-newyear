<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>红红火火家宴菜谱 · 看菜谱 · 点好菜</title>
<meta name="description" content="373 道家常好菜，红红火火中国年味。看菜谱、点好菜，一键生成年夜饭点菜单。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏮</text></svg>">
<style>
:root{
  --red-deep:#4d080c; --red-dark:#6d0f13; --red:#8a1418; --red-bright:#b01e28;
  --gold:#f7d794; --gold-bright:#ffd700; --gold-dim:#e6b422; --gold-deep:#b8860b;
  --cream:#fff5e6; --ink:#3a0507;
  --kai:"KaiTi","STKaiti","楷体","BiauKai",serif;
  --mono:"Cascadia Code","JetBrains Mono",Consolas,monospace;
  --shadow:0 10px 26px rgba(35,0,2,.45);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:"Microsoft YaHei","PingFang SC",sans-serif;
  color:var(--cream);min-height:100vh;
  background-color:var(--red-dark);
  background-image:
    radial-gradient(rgba(255,215,0,.045) 1px,transparent 1.6px),
    linear-gradient(180deg,#5c0a0e 0%,#7c1216 30%,#8a1418 55%,#5c0a0e 100%);
  background-size:26px 26px,auto;background-attachment:fixed;overflow-x:hidden;
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:1;
  background:radial-gradient(ellipse at 50% 25%,transparent 55%,rgba(30,0,2,.5) 100%)}
#fireworks{position:fixed;inset:0;z-index:2;pointer-events:none}

/* ---------- 灯笼 ---------- */
.lanterns{position:fixed;top:0;left:0;right:0;height:150px;z-index:3;pointer-events:none}
.lantern{position:absolute;top:-6px;transform-origin:top center;animation:sway 3.6s ease-in-out infinite alternate}
.lantern .rope{width:2px;height:38px;margin:0 auto;background:linear-gradient(#e6b422,#9c6b10)}
.lantern .cap,.lantern .cap-b{width:34px;height:9px;margin:0 auto;border-radius:3px;
  background:linear-gradient(180deg,#ffe08a,#c8922a);box-shadow:0 1px 3px rgba(0,0,0,.4)}
.lantern .cap-b{border-radius:3px 3px 6px 6px}
.lantern .body{width:82px;height:66px;border-radius:50%;position:relative;
  background:radial-gradient(circle at 34% 32%,#ff7a63,#e0202f 52%,#8f0f1d 96%);
  border:1px solid rgba(255,215,0,.55);
  box-shadow:inset -8px -8px 16px rgba(80,0,0,.45),inset 4px 6px 12px rgba(255,255,210,.25),0 0 26px rgba(255,90,60,.5);
  display:flex;align-items:center;justify-content:center}
.lantern .body::before,.lantern .body::after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(255,215,0,.28)}
.lantern .body::before{inset:4px 14px}.lantern .body::after{inset:4px 28px}
.lantern .char{font-family:var(--kai);font-size:30px;font-weight:700;color:var(--gold-bright);
  text-shadow:0 0 8px rgba(255,200,0,.9),0 2px 2px rgba(120,0,0,.8)}
.lantern .tassel{width:4px;height:30px;margin:0 auto;background:linear-gradient(#e6b422,#ffec9e,#c8922a);border-radius:2px}
.lantern .tassel::after{content:"";display:block;width:10px;height:14px;margin:0 auto;border-radius:0 0 6px 6px;
  background:linear-gradient(#ffd700,#b8860b);box-shadow:0 2px 4px rgba(0,0,0,.4)}
.lantern.big{transform:scale(1.2)}
@keyframes sway{from{transform:rotate(4.5deg)}to{transform:rotate(-4.5deg)}}

/* ---------- 春联 ---------- */
.couplet{position:fixed;top:120px;width:64px;z-index:3;display:flex;flex-direction:column;align-items:center;
  filter:drop-shadow(0 6px 14px rgba(0,0,0,.45));pointer-events:none}
.couplet.left{left:14px}.couplet.right{right:14px}
.couplet .top{width:52px;height:16px;background:linear-gradient(#ffe08a,#c8922a);border-radius:3px;margin-bottom:6px}
.couplet .paper{writing-mode:vertical-rl;font-family:var(--kai);font-size:30px;font-weight:700;letter-spacing:.35em;
  padding:22px 12px;color:#ffd700;background:linear-gradient(160deg,#c0182a,#8a0f1e);
  border:2px solid rgba(255,215,0,.6);border-radius:6px;text-shadow:0 0 10px rgba(255,170,0,.55)}
@media (max-width:1240px){.couplet{display:none}}

/* ---------- 窗花 ---------- */
.corner{position:fixed;width:150px;height:150px;z-index:3;pointer-events:none;opacity:.45}
.corner svg{width:100%;height:100%}
.corner.tl{top:0;left:0}.corner.tr{top:0;right:0;transform:scaleX(-1)}
.corner.bl{bottom:0;left:0;transform:scaleY(-1)}.corner.br{bottom:0;right:0;transform:scale(-1,-1)}
@media (max-width:900px){.corner{width:90px;height:90px;opacity:.32}}

/* ---------- 头部 ---------- */
header{position:relative;z-index:5;text-align:center;padding:92px 20px 26px}
.hpai{display:inline-block;font-family:var(--kai);font-size:26px;letter-spacing:.5em;text-indent:.5em;
  color:var(--ink);padding:8px 26px;margin-bottom:16px;font-weight:700;transform:rotate(-1.2deg);
  background:linear-gradient(180deg,#ffe9a8,#e6b422);border-radius:8px;border:2px solid #8a5a00;
  box-shadow:0 4px 18px rgba(255,180,0,.35),inset 0 1px 0 #fff8dc}
.fu-row{display:flex;align-items:center;justify-content:center;gap:24px;margin:4px 0 8px}
.fu{width:76px;height:76px;transform:rotate(45deg);display:flex;align-items:center;justify-content:center;
  background:linear-gradient(150deg,#d4232e,#9c101d);border:3px solid var(--gold-bright);border-radius:10px;
  box-shadow:0 0 30px rgba(255,60,40,.6),inset 0 0 18px rgba(0,0,0,.3);animation:fuspin 8s ease-in-out infinite}
.fu span{transform:rotate(-45deg);font-family:var(--kai);font-size:44px;font-weight:700;color:var(--gold-bright);
  text-shadow:0 0 12px rgba(255,190,0,.9)}
.fu.small{width:54px;height:54px}.fu.small span{font-size:30px}
@keyframes fuspin{0%,100%{transform:rotate(38deg) scale(1)}50%{transform:rotate(52deg) scale(1.06)}}
h1.title{font-family:var(--kai);font-size:clamp(42px,6.6vw,78px);font-weight:700;letter-spacing:.1em;line-height:1.15;
  background:linear-gradient(180deg,#fff3c4 8%,#ffd700 38%,#e8a20c 55%,#ffe9a0 78%,#f7c833 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 3px rgba(60,0,0,.65)) drop-shadow(0 0 22px rgba(255,160,0,.35));
  animation:shimmer 5s linear infinite;background-size:100% 300%}
@keyframes shimmer{0%{background-position:0 130%}100%{background-position:0 -30%}}
.subtitle{margin-top:12px;font-size:16.5px;color:#ffd9a8;letter-spacing:.14em}
.wish{margin-top:12px;font-family:var(--kai);font-size:19px;color:var(--gold);letter-spacing:.2em;
  text-shadow:0 2px 6px rgba(60,0,0,.6)}

/* ---------- 搜索 ---------- */
.search-wrap{position:relative;max-width:520px;margin:22px auto 0}
.search-wrap .ico{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:17px;opacity:.75}
#search{width:100%;padding:13px 44px 13px 42px;font-size:15px;border-radius:999px;color:var(--cream);
  background:rgba(60,4,6,.6);border:1.5px solid rgba(230,180,34,.5);outline:none;transition:.22s;
  font-family:"Microsoft YaHei"}
#search::placeholder{color:#c98f6d}
#search:focus{border-color:var(--gold-bright);box-shadow:0 0 22px rgba(255,190,0,.3)}
.clear-btn{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:28px;height:28px;border:none;
  border-radius:50%;background:rgba(255,215,0,.16);color:var(--gold);cursor:pointer;font-size:15px;display:none}
.clear-btn.show{display:block}
.stats{margin-top:16px;font-size:14px;color:#f2c384;letter-spacing:.12em}
.stats b{color:var(--gold-bright);font-size:18px;font-family:var(--kai)}

/* ---------- 分类导航 ---------- */
.bar{position:sticky;top:0;z-index:6;background:linear-gradient(180deg,rgba(92,10,14,.97),rgba(92,10,14,.88));
  backdrop-filter:blur(8px);border-bottom:1px solid rgba(230,180,34,.28);box-shadow:0 4px 18px rgba(30,0,2,.4)}
.bar-inner{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.cats{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex:1;padding:2px}
.cats::-webkit-scrollbar{display:none}
.tab{font-family:var(--kai);font-size:16.5px;letter-spacing:.08em;cursor:pointer;user-select:none;white-space:nowrap;
  color:var(--gold);background:rgba(90,8,10,.5);border:1.5px solid rgba(230,180,34,.4);
  padding:7px 16px;border-radius:999px;transition:.2s}
.tab:hover{border-color:var(--gold-bright);color:var(--gold-bright);transform:translateY(-2px)}
.tab.active{background:linear-gradient(180deg,#ffe08a,#e6b422);color:var(--ink);font-weight:700;border-color:var(--gold-bright);
  box-shadow:0 4px 16px rgba(255,190,0,.4)}
.sortbtn{flex:none;font-size:13px;color:var(--gold);background:rgba(90,8,10,.5);border:1.5px solid rgba(230,180,34,.4);
  padding:7px 14px;border-radius:999px;cursor:pointer;font-family:"Microsoft YaHei"}
.sortbtn:hover{border-color:var(--gold-bright)}
.tablebtn{flex:none;font-family:var(--kai);font-size:16px;color:var(--ink);font-weight:700;white-space:nowrap;
  background:linear-gradient(180deg,#ffe08a,#e6b422);border:1.5px solid var(--gold-bright);padding:7px 16px;
  border-radius:999px;cursor:pointer;box-shadow:0 4px 14px rgba(255,190,0,.35)}
.tablebtn:hover{transform:translateY(-2px)}
.tablebtn .n{display:inline-block;min-width:20px;padding:0 6px;background:var(--red-bright);color:var(--gold-bright);
  border-radius:999px;font-size:12.5px;margin-left:5px;font-family:"Microsoft YaHei"}

/* 移动端分类触发按钮（桌面隐藏） */
.cbtn{display:none;flex:none;align-items:center;gap:5px;font-family:var(--kai);font-size:16.5px;
  letter-spacing:.06em;color:var(--gold);background:rgba(90,8,10,.5);border:1.5px solid rgba(230,180,34,.45);
  padding:7px 13px;border-radius:999px;cursor:pointer;white-space:nowrap}
.cbtn .ic{font-size:15px}
.cbtn .car{font-size:10px;color:var(--gold-dim)}
.cbtn:active{transform:scale(.96)}
@media (max-width:760px){
  .cbtn{display:inline-flex}
  .cats{display:none}
  .bar-inner{padding:8px 12px;gap:8px}
  .tab{font-size:15px;padding:6px 13px}
  .sortbtn .sp{display:none}
  .sortbtn{font-size:12.5px;padding:7px 12px}
  .tablebtn{display:none}
}

/* ---------- 分类选择弹层（移动端） ---------- */
.cat-ov{position:fixed;inset:0;z-index:58;display:none;align-items:flex-end;
  background:rgba(30,0,2,.72);backdrop-filter:blur(4px)}
.cat-ov.show{display:flex;animation:fadein .22s ease both}
.cat-sheet{width:100%;max-height:82vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  border-radius:22px 22px 0 0;border-top:2px solid var(--gold-bright);
  background:linear-gradient(170deg,#a31621,#5c0a0e 70%);
  box-shadow:0 -18px 50px rgba(0,0,0,.6);
  animation:up .3s cubic-bezier(.2,.8,.3,1.1) both}
@keyframes up{from{transform:translateY(46px);opacity:.5}to{transform:none;opacity:1}}
.cs-head{display:flex;align-items:center;gap:12px;padding:18px 18px 10px;position:sticky;top:0;
  background:linear-gradient(180deg,#a31621 70%,rgba(163,22,33,0));z-index:2}
.cs-head h3{font-family:var(--kai);font-size:23px;color:var(--gold-bright);letter-spacing:.18em}
.cs-head .hint{margin-left:auto;font-size:12.5px;color:#f0b78a}
.cs-close{width:32px;height:32px;flex:none;border-radius:50%;border:1.5px solid rgba(230,180,34,.55);
  background:rgba(40,0,2,.5);color:var(--gold-bright);cursor:pointer;font-size:17px;
  display:flex;align-items:center;justify-content:center}
.cs-close:active{background:var(--gold-bright);color:var(--ink)}
.cs-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:8px 16px 18px}
@media (min-width:480px){.cs-grid{grid-template-columns:repeat(3,1fr)}}
.cs-item{display:flex;align-items:center;gap:9px;text-align:left;cursor:pointer;
  border-radius:14px;padding:12px 12px;border:1.5px solid rgba(230,180,34,.35);
  background:linear-gradient(160deg,rgba(120,18,22,.85),rgba(70,6,8,.85));color:var(--cream);
  font-family:var(--kai);font-size:16.5px;letter-spacing:.04em;transition:.18s}
.cs-item .em{font-size:21px;flex:none}
.cs-item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cs-item .ct{flex:none;font-size:12px;color:#f0b78a;font-family:"Microsoft YaHei"}
.cs-item:active{transform:scale(.97)}
.cs-item.on{border-color:var(--gold-bright);color:var(--gold-bright);
  background:linear-gradient(160deg,#ffe08a,#e6b422);box-shadow:0 4px 18px rgba(255,190,0,.4)}
.cs-item.on .ct{color:#5a3200}
.cs-foot{padding:0 18px calc(20px + env(safe-area-inset-bottom));text-align:center;font-size:12.5px;color:#e0a878}

/* ---------- 网格 ---------- */
main{position:relative;z-index:5;max-width:1240px;margin:0 auto;padding:22px 22px 90px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:20px}
.card{position:relative;border-radius:16px;overflow:hidden;cursor:pointer;
  background:linear-gradient(165deg,#b01e28,#7c1016 70%);border:2px solid rgba(255,215,0,.45);
  box-shadow:var(--shadow);transition:transform .26s,box-shadow .26s,border-color .26s;
  animation:cardin .45s cubic-bezier(.2,.7,.3,1.2) both}
@keyframes cardin{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}
.card:hover{transform:translateY(-7px);border-color:var(--gold-bright);
  box-shadow:0 16px 36px rgba(30,0,2,.6),0 0 24px rgba(255,180,60,.32)}
.pic{position:relative;aspect-ratio:4/3;overflow:hidden;background:#5c0a0e}
.pic img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;display:block;
  transition:transform .5s,opacity .45s;opacity:0}
.pic img.loaded{opacity:1}
.pic .ph{z-index:0}
.pic.err .ph{display:flex}
.pic .spin{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center}
.pic .spin::before{content:"";width:30px;height:30px;border-radius:50%;border:3px solid rgba(255,215,0,.22);
  border-top-color:var(--gold-bright);animation:spin .8s linear infinite}
.pic.ok .spin,.pic.err .spin{display:none}
.pic .retry{position:absolute;left:0;right:0;bottom:8px;z-index:3;text-align:center;font-size:11.5px;
  color:#ffd9b0;opacity:0;pointer-events:none;transition:.2s}
.pic.err .retry{opacity:1;pointer-events:auto;cursor:pointer}
.card:hover .pic img{transform:scale(1.07)}
.pic .ph{position:absolute;inset:0;z-index:0;display:flex;align-items:center;justify-content:center;font-size:70px;
  background:radial-gradient(circle at 30% 25%,rgba(255,200,120,.16),transparent 55%),
  repeating-radial-gradient(circle at 50% 60%,rgba(255,215,0,.05) 0 3px,transparent 3px 26px),
  linear-gradient(160deg,#a31621,#6d0f13)}
.pic .ph span{filter:drop-shadow(0 6px 10px rgba(40,0,0,.5))}
.pic::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 55%,rgba(70,3,5,.8));pointer-events:none}
.card .cat{position:absolute;top:9px;left:9px;z-index:2;font-size:12px;color:var(--ink);
  background:linear-gradient(180deg,#ffe08a,#e6b422);padding:3px 10px;border-radius:999px;font-weight:700}
.card .body{padding:12px 14px 14px}
.card h3{font-family:var(--kai);font-size:21px;color:var(--gold-bright);letter-spacing:.05em;
  text-shadow:0 1px 2px rgba(60,0,0,.6);display:flex;align-items:baseline;gap:7px}
.card h3 .tag{font-size:11.5px;color:var(--ink);background:linear-gradient(180deg,#ffe08a,#e6b422);
  padding:2px 9px;border-radius:999px;font-family:"Microsoft YaHei";font-weight:700;white-space:nowrap}
.card .intro{font-size:12.5px;color:#ffd9b0;line-height:1.6;margin-top:6px;height:40px;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card .meta{display:flex;gap:12px;margin-top:9px;font-size:12px;color:#f0b78a;align-items:center}
.card .meta .stars{color:var(--gold-bright);letter-spacing:1px}
.addbtn{position:absolute;right:9px;bottom:9px;z-index:3;border:none;border-radius:999px;cursor:pointer;
  font-family:var(--kai);font-size:14px;font-weight:700;color:var(--ink);padding:6px 13px;
  background:linear-gradient(180deg,#ffe08a,#e6b422);border:1.5px solid #8a5a00;
  box-shadow:0 3px 10px rgba(0,0,0,.35);transition:.2s;opacity:0;transform:translateY(6px)}
.card:hover .addbtn{opacity:1;transform:none}
.addbtn:hover{filter:brightness(1.08);transform:scale(1.06)}
.addbtn.added{background:linear-gradient(180deg,#63d471,#2f9e44);color:#fff;border-color:#1f7a33;opacity:1;transform:none}
@media (hover:none){.addbtn{opacity:1;transform:none}}
.empty{text-align:center;padding:70px 20px;color:#f2c384}
.empty .big{font-family:var(--kai);font-size:26px;color:var(--gold-bright);margin-bottom:8px}
.loadmore{text-align:center;padding:26px 0 0;color:#e0a878;font-size:13.5px}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,215,0,.3);
  border-top-color:var(--gold-bright);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- 详情弹窗 ---------- */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(40,0,3,.8);backdrop-filter:blur(5px);
  display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:34px 16px 60px}
.overlay.show{display:flex;animation:fadein .25s ease both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.modal{width:min(880px,100%);border-radius:20px;overflow:hidden;position:relative;
  background:linear-gradient(170deg,#a31621,#5c0a0e 75%);border:2px solid rgba(255,215,0,.6);
  box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 40px rgba(255,120,60,.18);animation:pop .32s cubic-bezier(.2,.8,.3,1.15) both}
@keyframes pop{from{opacity:0;transform:translateY(26px) scale(.95)}to{opacity:1;transform:none}}
.m-hero{position:relative;height:250px;overflow:hidden;background:#5c0a0e}
.m-hero img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .45s}
.m-hero img.loaded{opacity:1}
.m-hero .ph{z-index:0}
.m-hero .spin{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center}
.m-hero .spin::before{content:"";width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,215,0,.22);
  border-top-color:var(--gold-bright);animation:spin .8s linear infinite}
.m-hero.ok .spin,.m-hero.err .spin{display:none}
.m-hero .retry{position:absolute;left:0;right:0;bottom:14px;z-index:3;text-align:center;font-size:12.5px;
  color:#ffd9b0;opacity:0;pointer-events:none;transition:.2s}
.m-hero.err .retry{opacity:1;pointer-events:auto;cursor:pointer}
.m-hero .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:110px;
  background:repeating-radial-gradient(circle at 50% 65%,rgba(255,215,0,.06) 0 4px,transparent 4px 34px),
  linear-gradient(160deg,#96201f,#5c0a0e)}
.m-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(60,2,4,.12),rgba(70,3,5,.9) 92%)}
.m-close{position:absolute;top:14px;right:16px;z-index:3;width:38px;height:38px;border-radius:50%;
  background:rgba(40,0,2,.65);border:1.5px solid rgba(255,215,0,.6);color:var(--gold-bright);font-size:20px;
  cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center}
.m-close:hover{background:var(--gold-bright);color:var(--ink);transform:rotate(90deg)}
.m-head{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:18px 26px;display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.m-head h2{font-family:var(--kai);font-size:clamp(28px,5vw,42px);color:var(--gold-bright);
  text-shadow:0 2px 6px rgba(60,0,0,.7);letter-spacing:.05em}
.m-head .tag{font-family:var(--kai);font-size:15px;color:var(--ink);font-weight:700;
  background:linear-gradient(180deg,#ffe08a,#e6b422);padding:4px 14px;border-radius:999px}
.m-body{padding:20px 26px 26px}
.chips{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:18px}
.chip{font-size:12.5px;color:#ffdca6;border:1px solid rgba(230,180,34,.45);background:rgba(70,5,7,.5);
  border-radius:999px;padding:5px 14px}
.chip b{color:var(--gold-bright)}

/* 菜谱数据改为外部 JSON 异步加载。
   原因：全量 373 道菜的数据内联进 HTML 会让主文档达到 ~930KB，
   实测 GitHub Pages CDN 返回这个大文件要 18~68 秒且极不稳定（甚至超时），
   导致用户长时间白屏。拆成外部文件后主文档只有 ~70KB，首屏秒开。 */
const DATA = [];
window.DISH_DATA_READY = false;
fetch("dishes.json", {cache:"force-cache"})
  .then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
  .then(arr=>{
    DATA.length = 0;
    arr.forEach(d=>DATA.push(d));
    window.DISH_DATA_READY = true;
    window.dispatchEvent(new Event("dishes-ready"));
  })
  .catch(err=>{
    const g=document.getElementById("grid");
    if(g) g.innerHTML = `<div class="empty" style="grid-column:1/-1"><div class="big">菜谱数据加载失败 😢</div>
      <div>请刷新页面重试</div></div>`;
    console.error("dishes.json 加载失败:", err);
  });
</script>

try{ menu=JSON.parse(localStorage.getItem(MENU_KEY)||"{}")||{}; }catch(e){ menu={}; }
function saveMenu(){ try{ localStorage.setItem(MENU_KEY,JSON.stringify(menu)); }catch(e){} }
function menuCount(){ return Object.values(menu).reduce((a,b)=>a+b,0); }
function dishById(id){ return DATA.find(d=>d.id===id); }

function addDish(id,delta){
  menu[id]=Math.max(0,(menu[id]||0)+delta);
  if(menu[id]===0) delete menu[id];
  saveMenu(); updateCounts(); refreshAddBtns();
  if(document.getElementById("drawer").classList.contains("open")) renderDrawer();
  const d=dishById(id);
  if(delta>0) toast(`已点 ${d?d.name:""} 🧨`);
}
function refreshAddBtns(){
  document.querySelectorAll("[data-add]").forEach(b=>{
    const q=menu[b.dataset.add]||0;
    b.textContent=q?`已点 ${q}`:"+ 点菜";
    b.classList.toggle("added",!!q);
  });
}
function updateCounts(){
  const n=menuCount();
  document.getElementById("tableN").textContent=n;
  document.getElementById("fabN").textContent=n;
  document.getElementById("dCnt").textContent=n? `共 ${n} 道菜`: "还没点菜";
}

/* ================= 分类与网格 ================= */
function catIcon(k){ const c=CATS.find(x=>x.k===k); return c?c.icon:"🧨"; }
function catCount(k){
  if(k==="全部") return DATA.length;
  if(k==="年夜饭精选") return DATA.filter(d=>d.featured).length;
  return DATA.filter(d=>d.cat===k).length;
}
function renderCats(){
  const box=document.getElementById("cats"); box.innerHTML="";
  CATS.forEach(c=>{
    const t=document.createElement("div");
    t.className="tab"+(c.k===curCat?" active":"");
    t.textContent=c.icon+" "+c.k;
    t.onclick=()=>{ pickCat(c.k); };
    box.appendChild(t);
  });
  renderCsGrid();
  syncCatBtn();
}
/* 移动端分类宫格 */
function renderCsGrid(){
  const grid=document.getElementById("csGrid");
  if(!grid) return;
  grid.innerHTML="";
  CATS.forEach(c=>{
    const b=document.createElement("button");
    b.className="cs-item"+(c.k===curCat?" on":"");
    b.innerHTML=`<span class="em">${c.icon}</span><span class="nm">${esc(c.k)}</span><span class="ct">${catCount(c.k)}</span>`;
    b.onclick=()=>{ pickCat(c.k); closeCatOv(); };
    grid.appendChild(b);
  });
}
function syncCatBtn(){
  const ic=document.getElementById("catBtnIc"), tx=document.getElementById("catBtnTx");
  if(ic) ic.textContent=catIcon(curCat);
  if(tx) tx.textContent=curCat;
}
function pickCat(k){
  curCat=k; shown=0; renderCats(); renderGrid();
  const bar=document.querySelector(".bar");
  if(bar) window.scrollTo({top:bar.offsetTop-10,behavior:"smooth"});
}
const catOv=document.getElementById("catOv");
function openCatOv(){ renderCsGrid(); catOv.classList.add("show"); document.body.style.overflow="hidden"; }
function closeCatOv(){ catOv.classList.remove("show"); if(!detailOverlay.classList.contains("show")&&!sheetOverlay.classList.contains("show")) document.body.style.overflow=""; }
document.getElementById("catBtn").onclick=openCatOv;
document.getElementById("catClose").onclick=closeCatOv;
catOv.addEventListener("click",e=>{ if(e.target===catOv) closeCatOv(); });
function currentList(){
  let out=DATA.filter(d=>{
    if(curCat==="全部") return true;
    if(curCat==="年夜饭精选") return !!d.featured;
    return d.cat===curCat;
  });
  if(curSearch){
    const q=curSearch.toLowerCase();
    out=out.filter(d=>(d.name+d.title+d.cat+(d.intro||"")+(d.ingredients||[]).join("")).toLowerCase().includes(q));
  }
  out.sort(SORTS[curSort].fn);
  return out;
}
function stars(n){ return "★".repeat(n)+"☆".repeat(Math.max(0,5-n)); }
function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function cardHTML(d,i){
  const pic=d.img
    ? `<div class="ph"><span>${d.emoji}</span></div>
       <div class="spin"></div>
       <img loading="lazy" decoding="async" data-src="${d.img}"${d.imgWebp?` data-webp="${d.imgWebp}"`:""} alt="${esc(d.name)}">
       <div class="retry">图片没加载出来 · 点此重试</div>`
    : `<div class="ph"><span>${d.emoji}</span></div>`;
  const q=menu[d.id]||0;
  return `<div class="card" data-id="${d.id}" style="animation-delay:${Math.min(i,24)*0.035}s">
    <div class="pic">${pic}<span class="cat">${d.cat}</span></div>
    <div class="body">
      <h3>${esc(d.name)}${d.tag?`<span class="tag">${d.tag}</span>`:""}</h3>
      <div class="intro">${esc(d.intro||"家常好菜，照着做就行。")}</div>
      <div class="meta"><span class="stars">${stars(d.difficulty)}</span>${d.calorie?`<span>🔥 ${d.calorie}</span>`:""}</div>
    </div>
    <button class="addbtn ${q?"added":""}" data-add="${d.id}">${q?`已点 ${q}`:"+ 点菜"}</button>
  </div>`;
}
function renderGrid(keepScroll){
  const grid=document.getElementById("grid");
  list=currentList();
  const chunk=list.slice(shown,shown+PAGE);
  if(shown===0) grid.innerHTML="";
  if(!list.length && shown===0){
    grid.innerHTML=`<div class="empty" style="grid-column:1/-1"><div class="big">没找到这道菜 🍵</div>
      <div>换个关键词试试，比如「豆腐」「鱼」「饺子」</div></div>`;
  } else {
    grid.insertAdjacentHTML("beforeend",chunk.map(cardHTML).join(""));
  }
  shown+=chunk.length;
  const lm=document.getElementById("loadmore");
  lm.style.display = shown<list.length ? "" : "none";
  if(!list.length) lm.style.display="none";
  bindCards();
}
function bindCards(){
  document.querySelectorAll("[data-add]").forEach(b=>{
    if(b.dataset.bound) return; b.dataset.bound="1";
    b.onclick=e=>{ e.stopPropagation(); addDish(b.dataset.add,1); };
  });
  document.querySelectorAll(".card").forEach(c=>{
    if(c.dataset.bound) return; c.dataset.bound="1";
    c.onclick=e=>{ if(e.target.closest("[data-add]")) return; openDetail(c.dataset.id); };
  });
  // 图片：JS 接管加载（失败自动重试 → 降级占位）
  document.querySelectorAll(".pic img[data-src]").forEach(img=>{
    if(img.dataset.loaded) return; img.dataset.loaded="1";
    imgLoad(img);
  });
  bindImgRetry(document);
}

/* ================= 图片加载管理（多源 / 重试 / 超时 / 降级 / 并发限流） =================
   GitHub Pages 的 CDN 边缘节点偶发不稳定：实测同一批图片里约 3%~10% 会挂住或断连，
   最慢的一张卡了 60 秒以上。这里改为：JS 统一接管 → 依次尝试多个源（WebP 优先，体积小一半）
   → 失败自动重试（带时间戳绕 CDN 缓存的坏响应）→ 超时兜底 → 彻底失败降级为 emoji 占位 + 手动重试。
   同时限制并发数，避免几十个请求同时打 CDN 把它拖垮。

   ★ 实测校准（2026-11-03）：
     - 并发 4 → 成功率 90%，并发 8 → 97%，并发 16 → 90%。并发 8 是甜点，故保留 8。
     - 成功请求耗时中位 ~1.3s，但最慢的成功请求达 16s。因此超时不能设 8s，
       否则会把"只是慢"的好图片误判为失败（原实现正是这个 bug）。
     - 慢请求若一直占着并发槽位，后面所有图都排队等着 → 队头阻塞。
       因此慢图超时不释放槽位，而是降低它的优先级重新排队。

   ★ 修掉的双路径竞态（原先"偶发图片不显示"的真正根因）：
     超时分支执行 img.src="" 挂起请求时，浏览器会**额外派发一次 error 事件**，
     而 error 监听器又会 setTimeout(→imgAttempt) 重试 —— 于是同一张图同时走了
     "超时重试"和"错误重试"两条路，st.si/st.round 被双倍消耗，
     很快就把所有候选源打完，直接进入"彻底失败"降级状态。

   ★ 最终改用 fetch + AbortController（不再用 img.src 直接加载）：
     img.src 方式的超时只能"放弃等待"，无法真正中断请求 —— 挂起的连接仍占着
     浏览器的连接池（HTTP/1.1 单域通常只允许 6 个并发连接！）。
     实测线上滚动时 48 张图同时处于 loading 状态，远超我们设的 8 并发上限，
     连接池被挂起请求占满 → 后续图片全部排队卡死 → 用户看到"图片时有时无"。
     改用 fetch 后可以用 AbortController 真正 abort 掉挂起的请求，
     连接立即归还池子，并发上限才真正生效，失败也能立刻换源重试。 */
const IMG_MAX_RETRY   = 4;      // 每个源的重试轮数（比原来多留一轮余量）
const IMG_TIMEOUT     = 25000;  // 单次加载超时（毫秒）
   /* 实测：即使串行 100ms 间隔请求，也有约 7% 的图片要 20 秒以上才响应
      （GitHub Pages CDN 边缘节点在部分网络下极不稳定）。
      超时设得太短会把"只是慢"的好图片误判为失败 —— 之前设 8~15 秒时
      实测有 90% 的请求被误杀。25 秒能覆盖绝大多数情况。 */
const IMG_MAX_CONCURRENT = 3;   // 真实并发请求数上限（配合速率节流使用）
const imgState = new WeakMap();

/* 浏览器是否支持 WebP（支持则优先用，体积约为 JPEG 的 60%） */
const WEBP_OK = (function(){
  try{
    const c = document.createElement("canvas");
    c.width = c.height = 1;
    return c.toDataURL("image/webp").indexOf("data:image/webp") === 0;
  }catch(e){ return false; }
})();

let imgActive = 0;
const imgQueue = [];
/* 运行时计数器（用于排查加载异常，代价极小） */
const IMG_STAT = {started:0, ok:0, fail:0, timeout:0, abort:0, enqueued:0};
if(typeof window!=="undefined") window.__imgStat = IMG_STAT;
/* 队列内部状态探针（排查用） */
if(typeof window!=="undefined"){
  window.__imgQueue = ()=>({active:imgActive, queued:imgQueue.length,
    speed:+imgScrollSpeed.toFixed(3), throttle:imgThrottle()});
}

/* ---- 滚动速度自适应 + 速率节流 ----------------------------------------
   实测（2026-11-03，线上 GitHub Pages CDN）：
     - 慢速滚动（每屏停 3 秒，26 个请求）：全部成功，0 超时
     - 快速滚动（瞬间涌入 175 个请求）：大面积挂起 → 90% 超时
   也就是说 CDN 并非不可靠，而是**扛不住突发请求速率**。
   对策：
     1) 监测滚动速度 —— 滚得快就少发、慢发，停下来再放开；
     2) 请求之间强制最小间隔（节流），把速率压在 CDN 能承受的范围内；
     3) 超时后冷却重试，不做立刻重排队（避免打-挂-重试死循环）。 */
let imgLastScrollY = 0, imgLastScrollT = Date.now(), imgScrollSpeed = 0;
function imgTrackScroll(){
  const y = window.scrollY || 0;
  const now = Date.now();
  const dt = Math.max(1, now - imgLastScrollT);
  imgScrollSpeed = Math.abs(y - imgLastScrollY) / dt;   // px/ms
  imgLastScrollY = y; imgLastScrollT = now;
}
/* 速度衰减：停止滚动后，速度值应随时间回落，否则会一直卡在"慢速档"。
   没有这个衰减，用户滚完停下后图片仍按最低速率加载，体验很差。 */
function imgDecaySpeed(){
  const idle = Date.now() - imgLastScrollT;
  if(idle > 400) imgScrollSpeed *= 0.5;   // 每 2 秒衰减一半
  if(imgScrollSpeed < 0.02) imgScrollSpeed = 0;
}
/* 依滚动速度给出的最小请求间隔（毫秒）与并发上限 */
function imgThrottle(){
  imgDecaySpeed();
  if(imgScrollSpeed > 2.5) return {gap:350, conc:2};
  if(imgScrollSpeed > 1.0) return {gap:200, conc:3};
  if(imgScrollSpeed > 0.35) return {gap:130, conc:4};
  return {gap:90, conc:IMG_MAX_CONCURRENT};
}
if(typeof window!=="undefined"){
  window.addEventListener("scroll", imgTrackScroll, {passive:true});
}
/* 发射器：保证任意两次请求之间至少间隔 gap 毫秒 */
let imgLastFireT = 0;
function imgPump(){
  const th = imgThrottle();
  const now = Date.now();
  const wait = imgLastFireT + th.gap - now;
  if(wait > 0){ imgSchedulePump(wait); return; }
  let fired = 0;
  while(imgActive < th.conc && imgQueue.length && fired < th.conc){
    const job = imgQueue.shift();
    imgActive++;
    fired++;
    imgLastFireT = Date.now();
    job();
  }
  if(imgQueue.length) imgSchedulePump(Math.max(th.gap, 200));
}
let imgPumpTimer = null;
function imgSchedulePump(delay){
  if(imgPumpTimer) return;
  imgPumpTimer = setTimeout(()=>{ imgPumpTimer = null; imgPump(); }, delay);
}
function imgRelease(){
  imgActive = Math.max(0, imgActive-1);
  imgPump();
}
/* 把图片排进队列尾部（不占用槽位，槽位在真正取出时才占） */
function imgEnqueue(img, delay){
  const run = ()=>{
    IMG_STAT.enqueued++;
    if(!img.isConnected) return;
    const st = imgState.get(img);
    if(!st || st.done || st.failed) return;
    imgQueue.push(()=>{
      if(!img.isConnected){ imgRelease(); return; }
      imgAttempt(img);
    });
    imgPump();
  };
  if(delay) setTimeout(run, delay); else run();
}

/* 只有滚进视野附近才真正发起请求，避免一次性几十个请求把 CDN 打爆 */
const imgObserver = ("IntersectionObserver" in window)
  ? new IntersectionObserver(entries=>{
      entries.forEach(en=>{
        if(!en.isIntersecting) return;
        const img = en.target;
        imgObserver.unobserve(img);
        if(img.dataset.imstarted) return;   // 已开始加载过
        img.dataset.imstarted = "1";
        const s = imgState.get(img);
        if(!s || s.done || s.failed) return;
        IMG_STAT.started++;
        imgEnqueue(img, 0);
      });
    }, {rootMargin:"900px 0px"})
  : null;

/* 生成候选 URL 列表：WebP 优先 → JPEG 兜底 → 带时间戳的绕缓存重试 */
function imgUrls(st, attempt){
  const list = [];
  const base = st.src;
  if(base.endsWith(".jpg") && WEBP_OK && st.srcWebp){
    list.push(st.srcWebp);
  }
  list.push(base);
  // 重试轮次加时间戳，绕过 CDN 缓存的坏响应
  // （CDN 边缘节点会把坏响应缓存住，不换 URL 会一直拿到同一份坏数据）
  if(attempt > 1){
    const busted = u => u + (u.includes("?")?"&":"?") + "r=" + attempt + "_" + Date.now();
    return list.map(busted);
  }
  return list;
}
/* 推进到下一个候选源；返回 false 表示候选已全部用尽
   forceNext=true 时直接跳到下一轮（带时间戳绕 CDN 坏缓存），
   用于超时场景 —— 同一个 URL 拿到的还是那份坏响应，换 URL 才有用。 */
function imgNext(img, forceNext){
  const st = imgState.get(img);
  if(!st) return false;
  const urls = imgUrls(st, st.round);
  if(forceNext || st.si >= urls.length){
    st.round++;
    st.si = 0;
    if(st.round > IMG_MAX_RETRY) return false;   // 彻底失败
  }
  return true;
}
/* 彻底失败：降级为 emoji 占位 + 提示可手动重试 */
function imgFail(img){
  const st = imgState.get(img); if(!st) return;
  st.failed = true;
  if(st.cleanup) st.cleanup();
  const pic = img.closest(".pic,.m-hero");
  if(pic){ pic.classList.remove("ok","loading"); pic.classList.add("err"); }
  img.style.display = "none";
  imgRelease();
}

/* 发起一次加载尝试。
   用 fetch + AbortController 而不是 img.src：
   - 超时能真正 abort 掉挂起的请求，把 HTTP 连接归还浏览器连接池
   - 不会因为 img.src="" 触发额外的 error 事件造成双路径竞态
   - 并发上限才真正生效（HTTP/1.1 单域连接池通常只有 6 个） */
function imgAttempt(img){
  const st = imgState.get(img);
  if(!st || st.done || st.failed) return;
  if(st.cleanup) st.cleanup();

  // 上一次是超时 → 强制跳到下一轮，用带时间戳的新 URL 绕开 CDN 的坏缓存
  const forceNext = !!st.forceNext;
  st.forceNext = false;
  if(!imgNext(img, forceNext)){ imgFail(img); return; }
  const urls = imgUrls(st, st.round);
  const url = urls[st.si++];
  const gen = ++st.gen;

  const pic = img.closest(".pic,.m-hero");
  if(pic){ pic.classList.remove("err"); pic.classList.add("loading"); }
  img.style.display = "";

  const ctrl = new AbortController();
  let timer = null;
  const cleanup = ()=>{
    if(timer){ clearTimeout(timer); timer = null; }
    try{ ctrl.abort(); }catch(e){}
    if(st.cleanup === cleanup) st.cleanup = null;
  };
  st.cleanup = cleanup;

  const finish = (ok, reason)=>{
    if(gen !== st.gen) return;          // 陈旧回调，忽略
    cleanup();
    if(ok){
      st.done = true;
      IMG_STAT.ok++;
      img.classList.add("loaded");
      const p = img.closest(".pic,.m-hero");
      if(p){ p.classList.remove("loading","err"); p.classList.add("ok"); }
      imgRelease();
    }else{
      IMG_STAT.fail++;
      // 退避重试：避免网络瞬断时瞬间把所有重试打完
      imgRelease();
      imgEnqueue(img, Math.min(700 * st.si, 2500));
    }
  };

  timer = setTimeout(()=>{
    if(gen !== st.gen) return;
    if(img.complete && img.naturalWidth>0){ finish(true); return; }
    // 超时 → abort 请求（连接立即归还池子），换下一个源重试
    IMG_STAT.timeout++;
    st.forceNext = true;    // 下次尝试用带时间戳的新 URL，绕开 CDN 缓存的坏响应
    cleanup();
    imgRelease();
    // 超时说明 CDN 当前压力过大 —— 立刻重排队会形成"打-挂-重试"死循环，
    // 必须冷却一段时间，等 CDN 缓过来再试。
    imgEnqueue(img, 3000 + Math.random()*4000);
  }, IMG_TIMEOUT);

  fetch(url, {signal: ctrl.signal, cache:"default"})
    .then(res=>{
      if(!res.ok) throw new Error("HTTP "+res.status);
      return res.blob();
    })
    .then(blob=>{
      if(gen !== st.gen) return;
      const objUrl = URL.createObjectURL(blob);
      const prevUrl = img.dataset.objurl;
      if(prevUrl) URL.revokeObjectURL(prevUrl);
      img.dataset.objurl = objUrl;
      img.src = objUrl;
      // 等图片真正解码完成再算成功
      const done = ()=>{ if(img.dataset.objurl===objUrl) URL.revokeObjectURL(objUrl); finish(true); };
      if(img.complete && img.naturalWidth>0) done();
      else img.addEventListener("load", done, {once:true});
    })
    .catch(err=>{
      if(gen !== st.gen) return;
      if(err && err.name === "AbortError"){ IMG_STAT.abort++; return; }
      finish(false);
    });
}

function imgLoad(img, force){
  const prev = imgState.get(img);
  // 已创建过 state 且不是强制重试 → 只保证监听器与观察都已就绪
  if(prev && !force){
    if(imgObserver && !img.dataset.imobserved){ img.dataset.imobserved="1"; imgObserver.observe(img); }
    return;
  }
  const st = prev || {si:0, round:1, timer:null, src:img.dataset.src||"", srcWebp:img.dataset.webp||"",
                      done:false, failed:false, released:false, slot:false, gen:0, cleanup:null};
  st.src = img.dataset.src || st.src;
  st.srcWebp = img.dataset.webp || st.srcWebp;
  st.si = 0; st.round = 1; st.done = false; st.failed = false; st.gen++;
  imgState.set(img, st);

  // 交给 IntersectionObserver：滚进视野附近才开始加载
  if(imgObserver){
    if(!img.dataset.imobserved){ img.dataset.imobserved="1"; imgObserver.observe(img); }
  } else {
    imgEnqueue(img, 0);
  }
}

/* 手动重试：点击失败卡片上的提示条 */
function bindImgRetry(root){
  root.querySelectorAll(".pic .retry, .m-hero .retry").forEach(r=>{
    if(r.dataset.bound) return; r.dataset.bound="1";
    r.onclick = e=>{
      e.stopPropagation();
      const pic = r.closest(".pic,.m-hero");
      const img = pic.querySelector("img[data-src]");
      if(!img) return;
      pic.classList.remove("err");
      const st = imgState.get(img);
      if(st){
        if(st.cleanup) st.cleanup();
        st.si = 0; st.round = 1; st.done = false; st.failed = false; st.gen++;
        st.src = img.dataset.src;   // 用原始 URL 重新开始
        st.srcWebp = img.dataset.webp || st.srcWebp;
        const isHero = !!pic.classList.contains("m-hero");
        if(isHero){
          // 弹窗大图不占并发槽位（用户正在看这张图，最高优先级）
          imgAttempt(img);
        } else {
          // 卡片图重新入队，由队列统一分配并发槽位
          imgEnqueue(img, 0);
        }
      } else {
        imgLoad(img, true);
      }
      img.style.display = "";    };
  });
}

/* 详情弹窗大图同样走重试逻辑 */
function heroHTML(d){
  if(!d.img) return `<div class="ph"><span>${d.emoji}</span></div>`;
  return `<div class="ph"><span>${d.emoji}</span></div>
          <div class="spin"></div>
          <img decoding="async" data-src="${d.img}"${d.imgWebp?` data-webp="${d.imgWebp}"`:""} alt="${esc(d.name)}">
          <div class="retry">图片没加载出来 · 点此重试</div>`;
}
function bindHero(){
  const img = detailModal.querySelector(".m-hero img[data-src]");
  if(img){
    // 弹窗大图走高优先级通道：直接发起请求，不进并发队列
    const st = {si:0, round:1, timer:null, src:img.dataset.src||"", srcWebp:img.dataset.webp||"",
                done:false, failed:false, released:false, slot:false, gen:0, cleanup:null};
    imgState.set(img, st);
    imgAttempt(img);
  }
  bindImgRetry(detailModal.querySelector(".m-hero"));
}
const detailOverlay=document.getElementById("detailOverlay");
const detailModal=document.getElementById("detailModal");
function openDetail(id){
  const d=dishById(id); if(!d) return;
  const hero=heroHTML(d);
  let ing="";
  if(d.ingredients.length||d.calc.items.length){
    ing=`<div class="sect"><div class="sect-h"><div class="n">备</div><h4>备料清单</h4><div class="line"></div></div>`;
    if(d.ingredients.length)
      ing+=`<div class="two-col">${d.ingredients.map(x=>`<div class="ing"><span>${esc(x)}</span></div>`).join("")}</div>`;
    if(d.calc.items.length){
      ing+=`<div class="subg-h">精准用量</div>`;
      if(d.calc.note) ing+=`<div class="calc-note">${esc(d.calc.note)}</div>`;
      ing+=`<div class="two-col">${d.calc.items.map(x=>`<div class="ing"><span>${esc(x)}</span></div>`).join("")}</div>`;
    }
    ing+="</div>";
  }
  let steps="";
  if(d.steps.length){
    steps=`<div class="sect"><div class="sect-h"><div class="n">烹</div><h4>开工步骤</h4><div class="line"></div></div>`;
    d.steps.forEach(g=>{
      steps+=`<div class="subg-h">${esc(g.title)}</div>`;
      g.steps.forEach((s,i)=>{
        steps+=`<div class="step"><div class="num">${i+1}</div><div class="txt">${esc(s.text)}`;
        if(s.subs&&s.subs.length) steps+=`<div class="subs">${s.subs.map(x=>`<div>· ${esc(x)}</div>`).join("")}</div>`;
        steps+="</div></div>";
      });
    });
    steps+="</div>";
  }
  let tips="";
  if(d.tips.length){
    tips=`<div class="sect"><div class="sect-h"><div class="n">诀</div><h4>大厨贴士</h4><div class="line"></div></div>`+
      d.tips.map(t=>`<div class="tip-li"><span class="ic">💡</span><span>${esc(t)}</span></div>`).join("")+"</div>";
  }
  const q=menu[d.id]||0;
  detailModal.innerHTML=
    `<div class="m-hero">${hero}<button class="m-close" onclick="closeDetail()">✕</button>
      <div class="m-head"><h2>${esc(d.name)}</h2>${d.tag?`<span class="tag">${d.tag}</span>`:""}</div></div>
    <div class="m-body">
      <div class="chips">
        <div class="chip">${d.cat}</div>
        <div class="chip">难度 <span class="stars">${stars(d.difficulty)}</span></div>
        ${d.calorie?`<div class="chip">热量 <b>${d.calorie}</b></div>`:""}
        ${d.featured?`<div class="chip">🏮 年夜饭精选</div>`:""}
      </div>
      ${d.intro?`<div class="intro-p">${esc(d.intro)}</div>`:""}
      ${ing}${steps}${tips}
      <div class="m-foot">
        <button class="big-add ${q?"added":""}" id="detailAdd" onclick="toggleDish('${d.id}')">${q?`已点 ${q} 道 ✓`:"＋ 点这道菜"}</button>
        <a class="repo" href="${d.src}" target="_blank" rel="noopener">📄 查看原始菜谱</a>
      </div>
    </div>`;
  detailOverlay.classList.add("show");
  detailOverlay.scrollTop=0;
  document.body.style.overflow="hidden";
  bindHero();
}
function closeDetail(){ detailOverlay.classList.remove("show"); document.body.style.overflow=""; }
function toggleDish(id){
  const q=menu[id]||0;
  addDish(id, q? -q : 1);
  const b=document.getElementById("detailAdd");
  if(b){ const n=menu[id]||0; b.textContent=n?`已点 ${n} 道 ✓`:"＋ 点这道菜"; b.classList.toggle("added",!!n); }
}
detailOverlay.addEventListener("click",e=>{ if(e.target===detailOverlay) closeDetail(); });

function renderDrawer(){
  const body=document.getElementById("dBody"), sum=document.getElementById("dSum");

  body.innerHTML=ids.map(id=>{

        <div class="nm">${esc(d.name)}</div><div class="ct">${d.cat}</div>
      </div>

        <button onclick="addDish('${id}',-1)">−</button><span class="q">${menu[id]}</span>

                 <div class="row" style="font-size:12px"><span>${detail}</span></div>`;

function removeDish(id){ delete menu[id]; saveMenu(); updateCounts(); renderDrawer(); refreshAddBtns(); }

function closeSheet(){ sheetOverlay.classList.remove("show"); if(!detailOverlay.classList.contains("show")) document.body.style.overflow=""; }
sheetOverlay.addEventListener("click",e=>{ if(e.target===sheetOverlay) closeSheet(); });
function printSheet(){ window.print(); }
function menuText(){
  const ids=Object.keys(menu);
  const lines=ids.map((id,i)=>{ const d=dishById(id); return `${i+1}. ${d?d.name:""} × ${menu[id]}`; });
  return `🧨 红红火火点菜单（共 ${menuCount()} 道）\n`+lines.join("\n")+"\n—— 阖家团圆，年年有余 ——";
}
function copyMenu(){
  const t=menuText();
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(()=>toast("菜单已复制，去微信粘贴吧 📋")).catch(()=>fallbackCopy(t));
  } else fallbackCopy(t);
}
function fallbackCopy(t){
  const ta=document.createElement("textarea");
  ta.value=t; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); toast("菜单已复制 📋"); }catch(e){ toast("复制失败，请手动截图"); }
  document.body.removeChild(ta);
}
document.getElementById("btnCopy").onclick=copyMenu;

/* ================= 烟花 ================= */
(function(){
  const cv=document.getElementById("fireworks"), ctx=cv.getContext("2d");
  let W,H; function fit(){W=cv.width=innerWidth;H=cv.height=innerHeight;} fit(); addEventListener("resize",fit);
  const COLORS=["#ffd700","#ff6b5e","#ff4757","#ffe9a0","#ff9f43","#f8a5c2","#fff5e6"];
  let parts=[],rockets=[];
  function launch(){
    rockets.push({x:W*0.12+Math.random()*W*0.76,y:H+6,
      vy:-(H*0.010+Math.random()*H*0.004),targetY:H*0.12+Math.random()*H*0.3,
      color:COLORS[Math.random()*COLORS.length|0]});
  }
  function boom(x,y,color){
    const n=42+(Math.random()*26|0);
    for(let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2,sp=1.2+Math.random()*4.2;
      parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:60+Math.random()*40,age:0,
        color:Math.random()<.72?color:COLORS[Math.random()*COLORS.length|0],size:1.2+Math.random()*1.8});
    }
  }
  function loop(){
    ctx.clearRect(0,0,W,H); ctx.globalCompositeOperation="lighter";
    for(let i=rockets.length-1;i>=0;i--){
      const r=rockets[i]; r.y+=r.vy;
      ctx.beginPath(); ctx.strokeStyle="#ffe9a0"; ctx.lineWidth=2;
      ctx.moveTo(r.x,r.y); ctx.lineTo(r.x,r.y-14); ctx.stroke();
      ctx.beginPath(); ctx.fillStyle=r.color; ctx.arc(r.x,r.y,2.4,0,7); ctx.fill();
      if(r.y<=r.targetY){ boom(r.x,r.y,r.color); rockets.splice(i,1); }
    }
    for(let i=parts.length-1;i>=0;i--){
      const p=parts[i]; p.age++; p.x+=p.vx; p.y+=p.vy;
      p.vy+=0.045; p.vx*=0.985; p.vy*=0.985;
      const a=1-p.age/p.life; if(a<=0){parts.splice(i,1);continue;}
      ctx.beginPath(); ctx.fillStyle=p.color; ctx.globalAlpha=Math.max(0,a);
      ctx.arc(p.x,p.y,p.size*(0.5+a*0.5),0,7); ctx.fill();
    }
    ctx.globalAlpha=1; ctx.globalCompositeOperation="source-over";
    requestAnimationFrame(loop);
  }
  setInterval(()=>{ if(document.visibilityState==="visible") launch(); },1500);
  for(let i=0;i<3;i++) setTimeout(launch,500+i*600);
  loop();
})();

})();
